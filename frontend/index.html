<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMAAR - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #e5e5e5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 900px;
            height: 520px;
            background: white;
            display: flex;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .left-side {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
            font-size: 24px;
        }

        label {
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: #f8f9fa;
        }

        .btn {
            width: 100%;
            background: #28a745;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn:hover {
            background: #218838;
        }

        .right-side {
            flex: 1;
            background: #6C2365;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .right-side h1 {
            font-size: 44px;
            font-weight: bold;
            line-height: 1.3;
        }

        .dashboard {
            padding: 3rem;
            background: #e5e5e5;
            min-height: 100vh;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            min-height: 150px;
        }

        .card h3 {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #333;
            line-height: 1.3;
        }

        .semestre {
            color: #666;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .professor {
            font-weight: bold;
            color: #333;
            font-size: 1rem;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="login-page">
        <div class="login-container">
            <div class="left-side">
                <h2 class="title">LOGIN</h2>
                <label>Senha</label>
                <input type="email" placeholder="admin@aluno.unb.br" />
                <label>Confirme a senha</label>
                <input type="password" placeholder="Password" />
                <button class="btn" onclick="showDashboard()">Alterar senha</button>
            </div>
            <div class="right-side">
                <h1>Bem vindo<br>ao<br>Camaar</h1>
            </div>
        </div>
    </div>

    <div id="dashboard-page" class="hidden">
        <div class="dashboard">
            <div class="grid">
                <div class="card">
                    <h3>BANCOS DE DADOS</h3>
                    <p class="semestre">2021.2</p>
                    <p class="professor">MARISTELA TERTO DE HOLANDA</p>
                </div>
                <div class="card">
                    <h3>ENGENHARIA DE SOFTWARE</h3>
                    <p class="semestre">2021.2</p>
                    <p class="professor">MARISTELA TERTO DE HOLANDA</p>
                </div>
                <div class="card">
                    <h3>PROGRAMAÇÃO CONCORRENTE</h3>
                    <p class="semestre">2021.2</p>
                    <p class="professor">MARISTELA TERTO DE HOLANDA</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showDashboard() {
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('dashboard-page').classList.remove('hidden');
        }
    </script>
</body>
</html>
